# =====================================================================
# Proyecto      : Sistema Web de Ventas e Inventario - Bodega Armando Tornero
# Archivo       : application.properties
# Descripcion   : Configuracion del backend: conexion a MySQL, JPA,
#                 sesion y servicio de los archivos de la capa de
#                 presentacion.
# Autor         : Juan Cesar Retuerto Ibanez
# Creado por    : Juan Cesar Retuerto Ibanez
# Ultima modificacion : Juan Cesar Retuerto Ibanez
# =====================================================================

spring.application.name=bodega-armando-backend
server.port=8080

# ---------------------------------------------------------------------
# Base de datos MySQL (capa de datos)
# Ajustar usuario y contrasena segun la instalacion local.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bodega_armando?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Leonardo_30
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# El esquema lo crean los scripts de la carpeta base-datos, por lo que
# Hibernate no modifica ni valida la estructura de las tablas.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ---------------------------------------------------------------------
# Sesion de usuario
# ---------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------------------------------------------------------------
# Capa de presentacion
# Los archivos HTML, CSS y JavaScript se sirven desde la carpeta
# frontend del proyecto, de modo que el sistema se abre en
# http://localhost:8080 sin necesidad de otro servidor web.
# ---------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:../frontend/
spring.mvc.static-path-pattern=/**

# ---------------------------------------------------------------------
# Formato de fechas en las respuestas JSON
# ---------------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------
# Registro de actividad
# ---------------------------------------------------------------------
logging.level.pe.edu.upn.bodega=INFO
