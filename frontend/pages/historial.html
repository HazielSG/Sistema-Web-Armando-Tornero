<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Cesar Retuerto Ibanez">
    <meta name="description" content="Historial de ventas: consulta, filtrado por fechas, comprobante y anulacion.">
    <title>Historial de ventas - Bodega Armando Tornero</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="contenedor">
    <aside class="barra-lateral"></aside>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Historial de ventas</h1>
                <p>Consulta y filtrado de las ventas registradas</p>
            </div>
            <div class="acciones" style="margin-top:0;"></div>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <div class="tarjeta">
            <h2>Filtros de busqueda</h2>
            <div class="filtros">
                <div class="campo">
                    <label for="desde">Desde</label>
                    <input type="date" id="desde">
                </div>
                <div class="campo">
                    <label for="hasta">Hasta</label>
                    <input type="date" id="hasta">
                </div>
                <button type="button" id="btnFiltrar">Filtrar</button>
                <button type="button" class="secundario" id="btnHoy">Ventas de hoy</button>
            </div>
        </div>

        <div class="indicadores" id="indicadores"></div>

        <div class="tarjeta">
            <h2>Ventas registradas</h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Comprobante</th><th>Fecha</th><th>Cliente</th><th>Cajero</th>
                            <th class="centro">Pago</th>
                            <th class="numero">Total</th>
                            <th class="centro">Estado</th>
                            <th class="centro">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVentas"></tbody>
                </table>
            </div>
        </div>

    </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/historial.js"></script>
</body>
</html>
