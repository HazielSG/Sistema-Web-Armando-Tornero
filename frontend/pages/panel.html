<!DOCTYPE html>
<!--

    Descripcion   : Panel principal con los indicadores de productos, ventas del dia y alertas de stock bajo.
    Autor         : Juan Cesar Retuerto Ibanez
    Creado por    : Juan Cesar Retuerto Ibanez
    Ultima modificacion : Juan Cesar Retuerto Ibanez
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Cesar Retuerto Ibanez">
    <meta name="description" content="Panel principal con los indicadores de productos, ventas del dia y alertas de stock bajo.">
    <title>Panel principal - Bodega Armando Tornero</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="contenedor">
    <aside class="barra-lateral"></aside>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Panel principal</h1>
                <p>Resumen de la operacion de la bodega al dia de hoy</p>
            </div>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <div class="indicadores" id="indicadores"></div>

        <div class="tarjeta">
            <h2>
                Productos con stock bajo
                <a href="inventario.html"><button class="secundario pequeno">Ir a inventario</button></a>
            </h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Codigo</th><th>Producto</th><th>Categoria</th>
                            <th class="numero">Stock actual</th>
                            <th class="numero">Stock minimo</th>
                            <th class="centro">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaStockBajo"></tbody>
                </table>
            </div>
        </div>

        <div class="tarjeta" id="tarjetaAuditoria" style="display:none;">
            <h2>
                Ultimas operaciones registradas
                <a href="auditoria.html"><button class="secundario pequeno">Ver bitacora completa</button></a>
            </h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr><th>Fecha y hora</th><th>Usuario</th><th>Accion</th><th>Modulo</th><th>Descripcion</th></tr>
                    </thead>
                    <tbody id="tablaAuditoria"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/panel.js"></script>
</body>
</html>
