<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Cesar Retuerto Ibanez">
    <meta name="description" content="Gestion de proveedores: registrar, consultar y actualizar la informacion de los proveedores.">
    <title>Proveedores - Bodega Armando Tornero</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="contenedor">
    <aside class="barra-lateral"></aside>
    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Proveedores</h1>
                <p>Registro y consulta de los proveedores de la bodega</p>
            </div>
            <div class="acciones" style="margin-top:0;"></div>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <div class="tarjeta" id="tarjetaFormulario">
            <h2 id="tituloFormulario">Registrar proveedor</h2>
            <form id="formProveedor" class="formulario" autocomplete="off">
                <input type="hidden" id="idProveedor">
                <div class="campo">
                    <label for="ruc">RUC (11 digitos) *</label>
                    <input type="text" id="ruc" maxlength="11" minlength="11" pattern="[0-9]{11}" required>
                </div>
                <div class="campo">
                    <label for="razonSocial">Razon social *</label>
                    <input type="text" id="razonSocial" maxlength="150" required>
                </div>
                <div class="campo">
                    <label for="contacto">Persona de contacto</label>
                    <input type="text" id="contacto" maxlength="100">
                </div>
                <div class="campo">
                    <label for="telefono">Telefono</label>
                    <input type="text" id="telefono" maxlength="20">
                </div>
                <div class="campo">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" maxlength="120">
                </div>
                <div class="campo completo">
                    <label for="direccion">Direccion</label>
                    <input type="text" id="direccion" maxlength="200">
                </div>
                <div class="acciones completo">
                    <button type="submit" id="btnGuardar">Guardar proveedor</button>
                    <button type="button" class="secundario" id="btnCancelar">Limpiar formulario</button>
                </div>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Proveedores registrados</h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>RUC</th><th>Razon social</th><th>Contacto</th>
                            <th>Telefono</th><th>Correo</th><th>Direccion</th>
                            <th class="centro">Accion</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProveedores"></tbody>
                </table>
            </div>
        </div>

    </main>
</div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/proveedores.js"></script>
</body>
</html>
